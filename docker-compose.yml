# 기본:   docker compose up -d                       → 내부망 http://<pi>:8000
# 외부 공개 (택1):
#   Tailscale Funnel (권장): 파이 호스트에서  sudo tailscale funnel --bg 8000   (README 참고)
#   docker compose --profile tunnel up -d            → Cloudflare Tunnel (포트포워딩 불필요)
#   docker compose --profile caddy up -d             → Caddy + Let's Encrypt (80/443 포트포워딩 필요)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    # Pi 메모리 절약용 설정
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  hub:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUB_DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD}@db:5432/hub
      HUB_PUBLIC_HOSTS: ${HUB_PUBLIC_HOSTS:-}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      HUB_TEAM_CREATION: ${HUB_TEAM_CREATION:-admin_key}
      HUB_ADMIN_KEY: ${HUB_ADMIN_KEY:-}
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:-}
      HUB_WAKE_ENABLED: ${HUB_WAKE_ENABLED:-true}
      HUB_ALLOW_QUERY_TOKEN: ${HUB_ALLOW_QUERY_TOKEN:-true}
    ports:
      # 내부망에서만 쓰거나 터널/프록시를 쓸 때는 "127.0.0.1:8000:8000" 으로 바꿔도 됨
      - "8000:8000"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [hub]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN 을 .env 에 설정하세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [hub]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN 을 .env 에 설정하세요}

volumes:
  pgdata:
  caddy_data:
